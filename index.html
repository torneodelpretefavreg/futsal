function CompetizioniManager({competizioni, toast, onChiudi}){
  const vuoto = {nome:"", categoria:"Campionato", stagione:"", note:""};
  const [f,setF] = useState(vuoto);
  const set = (k,v)=>setF(x=>({...x,[k]:v}));
  const lista = [...competizioni].sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));

  const salvaComp = async () => {
    if(!f.nome.trim()) return toast("Serve il nome della competizione");
    const {id, ...dati} = f;
    dati.nome = dati.nome.trim();
    await salva(COL.competizioni, id, dati);
    setF(vuoto);
    toast(id ? "Competizione aggiornata" : "Competizione creata");
  };
  const modifica = c => setF({...vuoto, ...c});
  const rimuovi = async c => {
    if(confirm(`Elimini la competizione "${c.nome}"? Le partite già assegnate mantengono il nome.`)){
      await elimina(COL.competizioni, c.id); if(f.id===c.id) setF(vuoto); toast("Competizione eliminata");
    }
  };

  return (
    <Modale titolo="Competizioni" onChiudi={onChiudi} larghezza={640}>
      <div className="row g2">
        <Campo label="Nome"><input value={f.nome} onChange={e=>set("nome",e.target.value)} placeholder="es. Campionato Serie C2 2026/27" /></Campo>
        <Campo label="Categoria"><select value={f.categoria} onChange={e=>set("categoria",e.target.value)}>{CATEGORIE_COMP.map(c=><option key={c}>{c}</option>)}</select></Campo>
      </div>
      <div className="row g2">
        <Campo label="Stagione"><input value={f.stagione} onChange={e=>set("stagione",e.target.value)} placeholder="2026/27" /></Campo>
        <Campo label="Note"><input value={f.note} onChange={e=>set("note",e.target.value)} /></Campo>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:4}}>
        <button className="btn sm" onClick={salvaComp}>{f.id?"Salva modifica":"+ Aggiungi competizione"}</button>
        {f.id && <button className="btn ghost sm" onClick={()=>setF(vuoto)}>Annulla</button>}
      </div>
      <div className="divider"></div>
      {lista.length===0
        ? <div className="hint">Nessuna competizione ancora. Creane una qui sopra; comparirà nel menu quando registri una partita.</div>
        : <div className="tw"><table>
            <thead><tr><th>Nome</th><th>Categoria</th><th>Stagione</th><th></th></tr></thead>
            <tbody>{lista.map(c=>(
              <tr key={c.id}>
                <td><strong>{c.nome}</strong>{c.note?<div style={{fontSize:11,color:"var(--muted)"}}>{c.note}</div>:null}</td>
                <td>{c.categoria}</td>
                <td className="mono">{c.stagione||"—"}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn ghost sm" onClick={()=>modifica(c)}>Modifica</button>{" "}
                  <button className="btn danger sm" onClick={()=>rimuovi(c)}>×</button>
                </td>
              </tr>
            ))}</tbody>
          </table></div>}
    </Modale>
  );
}

function Risultati({allenamenti, membri, competizioni, toast}){
  const [modale,setModale] = useState(null);
  const [gestioneComp,setGestioneComp] = useState(false);

  const giocatori = membri.filter(m=>m.tipo==="Giocatore").sort((a,b)=>(a.cognome||"").localeCompare(b.cognome||""));
  const nomeG = id => { const m=membri.find(x=>x.id===id); return m?`${m.cognome} ${m.nome}`:"—"; };

  const partite = useMemo(()=>allenamenti.filter(e=>isMatch(e.tipo))
    .sort((a,b)=>(b.data+b.ora).localeCompare(a.data+a.ora)),[allenamenti]);

  const daCompilare = partite.filter(p=>!p.giocata && p.data<=oggi());
  const giocate = partite.filter(p=>p.giocata);
  const inProgramma = partite.filter(p=>!p.giocata && p.data>oggi());

  // classifiche
  const cls = useMemo(()=>{
    const gol={}, ass={}, gialli={}, rossi={};
    let v=0,n=0,s=0,gf=0,gsub=0;
    giocate.forEach(p=>{
      const nostri=Number(p.golNostri)||0, loro=Number(p.golLoro)||0;
      gf+=nostri; gsub+=loro;
      if(nostri>loro)v++; else if(nostri===loro)n++; else s++;
      (p.marcatori||[]).forEach(m=>{ if(m.giocatoreId){gol[m.giocatoreId]=(gol[m.giocatoreId]||0)+1;} if(m.assistId){ass[m.assistId]=(ass[m.assistId]||0)+1;} });
      (p.cartellini||[]).forEach(c=>{ if(c.tipo==="Rosso")rossi[c.giocatoreId]=(rossi[c.giocatoreId]||0)+1; else gialli[c.giocatoreId]=(gialli[c.giocatoreId]||0)+1; });
    });
    const top = o => Object.entries(o).sort((a,b)=>b[1]-a[1]);
    return {gol:top(gol), ass:top(ass), gialli, rossi, v,n,s,gf,gsub};
  },[giocate]);

  const apri = p => setModale({
    golNostri:"", golLoro:"", marcatori:[], cartellini:[], ...p,
    golNostri: p.golNostri ?? "", golLoro: p.golLoro ?? "",
    marcatori: p.marcatori||[], cartellini: p.cartellini||[]
  });
  const nuova = () => setModale({
    data:oggi(), ora:"18:30", tipo:"Partita", luogo:"", avversario:"", casa:true,
    competizione:"Campionato", giornata:"", golNostri:"", golLoro:"", marcatori:[], cartellini:[]
  });

  const set = (k,v)=>setModale(m=>({...m,[k]:v}));
  const addMarc = ()=>setModale(m=>({...m,marcatori:[...m.marcatori,{id:uid(),giocatoreId:"",assistId:"",minuto:""}]}));
  const setMarc = (id,k,v)=>setModale(m=>({...m,marcatori:m.marcatori.map(x=>x.id===id?{...x,[k]:v}:x)}));
  const delMarc = id=>setModale(m=>({...m,marcatori:m.marcatori.filter(x=>x.id!==id)}));
  const addCart = ()=>setModale(m=>({...m,cartellini:[...m.cartellini,{id:uid(),giocatoreId:"",tipo:"Giallo",minuto:""}]}));
  const setCart = (id,k,v)=>setModale(m=>({...m,cartellini:m.cartellini.map(x=>x.id===id?{...x,[k]:v}:x)}));
  const delCart = id=>setModale(m=>({...m,cartellini:m.cartellini.filter(x=>x.id!==id)}));

  const salvaReferto = async () => {
    const {id, ...d} = modale;
    if(!(d.avversario||"").trim()) return toast("Indica l'avversario");
    if(!d.tipo) d.tipo = "Partita";
    // "giocata" = c'è un punteggio inserito; altrimenti resta in programma
    const conPunteggio = d.golNostri !== "" && d.golNostri !== null && d.golLoro !== "" && d.golLoro !== null;
    d.giocata = conPunteggio;
    d.golNostri = Number(d.golNostri)||0;
    d.golLoro = Number(d.golLoro)||0;
    await salva(COL.allenamenti, id, d);
    setModale(null); toast(id ? "Partita aggiornata" : "Partita aggiunta");
  };
  const eliminaPartita = async () => {
    if(confirm(`Elimini la partita contro ${modale.avversario||"—"} del ${dataIT(modale.data)}?`)){
      await elimina(COL.allenamenti, modale.id); setModale(null); toast("Partita eliminata");
    }
  };

  const scoreLabel = p => {
    if(!p.giocata) return "—";
    const nostri=Number(p.golNostri)||0, loro=Number(p.golLoro)||0;
    return p.casa ? `${nostri}–${loro}` : `${loro}–${nostri}`;
  };
  const esito = p => {
    if(!p.giocata) return null;
    const nostri=Number(p.golNostri)||0, loro=Number(p.golLoro)||0;
    if(nostri>loro) return {t:"V",cls:"p-ok"}; if(nostri===loro) return {t:"N",cls:"p-warn"}; return {t:"P",cls:"p-bad"};
  };

  const esportaExcel = () => {
    const ref = [
      ["Data","Competizione","Casa/Tras.","Avversario","Ris. (noi-loro)","Esito","Marcatori","Cartellini"],
      ...partite.filter(p=>p.giocata).map(p=>[
        dataIT(p.data), p.competizione||"", p.casa?"Casa":"Trasferta", p.avversario||"",
        `${Number(p.golNostri)||0}-${Number(p.golLoro)||0}`,
        (esito(p)||{}).t||"",
        (p.marcatori||[]).map(m=>nomeG(m.giocatoreId)+(m.minuto?` ${m.minuto}'`:"")).join("; "),
        (p.cartellini||[]).map(c=>nomeG(c.giocatoreId)+" "+c.tipo).join("; ")
      ])
    ];
    const marcatori = [["Giocatore","Gol"], ...cls.gol.map(([id,n])=>[nomeG(id),n])];
    const assist = [["Giocatore","Assist"], ...cls.ass.map(([id,n])=>[nomeG(id),n])];
    scaricaExcel([
      {nome:"Referti", righe:ref},
      {nome:"Marcatori", righe:marcatori},
      {nome:"Assist", righe:assist}
    ], `risultati_${SQUADRA.toLowerCase().replace(/ /g,"_")}.xlsx`);
  };

  const Riga = ({p, azione}) => {
    const e = esito(p);
    return (
      <tr>
        <td><strong className="mono">{dataIT(p.data)}</strong><div style={{fontSize:11,color:"var(--muted)"}}>{p.competizione}{p.giornata?` · ${p.giornata}`:""}</div></td>
        <td>{p.casa? <span><strong>{SQUADRA}</strong> <span style={{color:"var(--muted)"}}>vs</span> {p.avversario}</span>
                    : <span>{p.avversario} <span style={{color:"var(--muted)"}}>vs</span> <strong>{SQUADRA}</strong></span>}</td>
        <td className="score">{scoreLabel(p)}</td>
        <td>{e && <span className={"pill "+e.cls}>{e.t}</span>}</td>
        <td style={{whiteSpace:"nowrap"}}>{azione}</td>
      </tr>
    );
  };

  return (
    <div className="section">
      <div className="grid g4" style={{marginBottom:14}}>
        <Stat k="Bilancio" v={`${cls.v}V ${cls.n}N ${cls.s}P`} s={`${giocate.length} gare giocate`} />
        <Stat k="Gol fatti" v={cls.gf} s={`${cls.gsub} subiti`} tono="mint" />
        <Stat k="Differenza reti" v={(cls.gf-cls.gsub>=0?"+":"")+(cls.gf-cls.gsub)} tono={cls.gf-cls.gsub>=0?"mint":"coral"} />
        <Stat k="Da compilare" v={daCompilare.length} s="partite giocate senza referto" tono={daCompilare.length?"amber":null} />
      </div>

      {daCompilare.length>0 && (
        <div className="card" style={{marginBottom:14}}>
          <div className="card-h"><h3>Da compilare</h3></div>
          <div className="tw"><table><tbody>
            {daCompilare.map(p=><Riga key={p.id} p={p} azione={<button className="btn sm" onClick={()=>apri(p)}>Inserisci risultato</button>} />)}
          </tbody></table></div>
        </div>
      )}

      <div className="grid" style={{gridTemplateColumns:"1.7fr 1fr"}}>
        <div className="card">
          <div className="card-h">
            <h3>Referti — {giocate.length}</h3>
            <div style={{display:"flex",gap:8}}>
              <button className="btn ghost sm" onClick={()=>setGestioneComp(true)}>Competizioni</button>
              <button className="btn ghost sm" onClick={esportaExcel}>Excel</button>
              <button className="btn sm" onClick={nuova}>+ Aggiungi partita</button>
            </div>
          </div>
          {giocate.length===0
            ? <Vuoto titolo="Nessun referto" testo="Aggiungi una partita da qui, oppure creala nel Calendario e inserisci qui il risultato." />
            : <div className="tw"><table>
                <thead><tr><th>Data</th><th>Partita</th><th>Ris.</th><th></th><th></th></tr></thead>
                <tbody>{giocate.map(p=><Riga key={p.id} p={p} azione={<button className="btn ghost sm" onClick={()=>apri(p)}>Modifica</button>} />)}</tbody>
              </table></div>}

          {inProgramma.length>0 && <>
            <div className="card-h" style={{borderTop:"1px solid var(--line)"}}><h3>In programma</h3></div>
            <div className="tw"><table><tbody>
              {inProgramma.map(p=>(
                <tr key={p.id}>
                  <td><strong className="mono">{dataIT(p.data)}</strong><div style={{fontSize:11,color:"var(--muted)"}}>{p.competizione}</div></td>
                  <td>{p.casa?"vs ":"@ "}{p.avversario}</td>
                  <td style={{color:"var(--muted)",fontSize:12}}>{p.ora}</td>
                  <td style={{textAlign:"right"}}><button className="btn ghost sm" onClick={()=>apri(p)}>Inserisci risultato</button></td>
                </tr>
              ))}
            </tbody></table></div>
          </>}
        </div>

        <div className="card">
          <div className="card-h"><h3>Classifica marcatori</h3></div>
          {cls.gol.length===0
            ? <Vuoto titolo="Nessun gol" testo="Compare dopo il primo referto." />
            : <div className="card-b">
                {cls.gol.slice(0,12).map(([id,n],i)=>(
                  <div key={id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #F0F3F1",fontSize:13}}>
                    <span><span className="mono" style={{color:"var(--muted)",marginRight:8}}>{i+1}</span>{nomeG(id)}</span>
                    <strong className="mono">{n}</strong>
                  </div>
                ))}
                {cls.ass.length>0 && <>
                  <h4 style={{fontSize:11,textTransform:"uppercase",letterSpacing:".06em",color:"var(--muted)",margin:"14px 0 6px"}}>Assist</h4>
                  {cls.ass.slice(0,8).map(([id,n])=>(
                    <div key={id} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:13}}>
                      <span>{nomeG(id)}</span><strong className="mono">{n}</strong>
                    </div>
                  ))}
                </>}
              </div>}
        </div>
      </div>

      {modale && (
        <Modale titolo={modale.id?"Partita":"Nuova partita"} onChiudi={()=>setModale(null)} onSalva={salvaReferto} salvaLabel={modale.id?"Salva":"Aggiungi"} larghezza={680}>

          </div>
          <div className="row g3">
            <Campo label="Competizione"><select value={modale.competizione} onChange={e=>set("competizione",e.target.value)}>{opzioniCompetizioni(competizioni, modale.competizione).map(c=><option key={c}>{c}</option>)}</select></Campo>
            <Campo label="Campo"><select value={modale.casa?"casa":"trasferta"} onChange={e=>set("casa",e.target.value==="casa")}><option value="casa">Casa</option><option value="trasferta">Trasferta</option></select></Campo>
            <Campo label="Giornata"><input value={modale.giornata||""} onChange={e=>set("giornata",e.target.value)} placeholder="es. 5ª" /></Campo>
          </div>
          <Campo label="Avversario"><input value={modale.avversario} onChange={e=>set("avversario",e.target.value)} placeholder="Nome squadra avversaria" /></Campo>

          <div className="divider"></div>
          <label style={{textAlign:"center",display:"block"}}>Risultato</label>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:6}}>

            <input type="number" min="0" placeholder="–" style={{width:60,textAlign:"center",fontWeight:700,fontSize:18}} value={modale.casa?modale.golNostri:modale.golLoro}
              onChange={e=>set(modale.casa?"golNostri":"golLoro", e.target.value)} />
            <span style={{color:"var(--muted)"}}>–</span>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <h4 style={{fontSize:12,textTransform:"uppercase",letterSpacing:".06em",color:"var(--muted)"}}>Cartellini</h4>

      )}

      {gestioneComp && <CompetizioniManager competizioni={competizioni} toast={toast} onChiudi={()=>setGestioneComp(false)} />}

const MOV_VUOTO = { data:oggi(), verso:"Uscita", categoria:"Affitto palestra", descrizione:"", importo:"", metodo:"Contanti", membroId:"", incassato:true };

function Bilancio({movimenti, membri, toast}){
  const [modale,setModale] = useState(null);
  const [anno,setAnno] = useState(new Date().getFullYear().toString());

  const anni = useMemo(()=>{
    const s = new Set(movimenti.map(m=>(m.data||"").slice(0,4)).filter(Boolean));
    s.add(new Date().getFullYear().toString());
    return [...s].sort().reverse();
  },[movimenti]);

  const mov = useMemo(()=>movimenti
    .filter(m=>(m.data||"").startsWith(anno))
    .sort((a,b)=>(b.data||"").localeCompare(a.data||"")),[movimenti,anno]);

  const entrate = mov.filter(m=>m.verso==="Entrata").reduce((s,m)=>s+Number(m.importo||0),0);
  const uscite  = mov.filter(m=>m.verso==="Uscita").reduce((s,m)=>s+Number(m.importo||0),0);
  const saldo   = entrate - uscite;
  const daIncassare = mov.filter(m=>m.verso==="Entrata" && !m.incassato).reduce((s,m)=>s+Number(m.importo||0),0);

  const perMese = useMemo(()=>{
    const map = {};
    mov.forEach(m=>{
      const k = meseKey(m.data);

      map[k][m.verso==="Entrata"?"e":"u"] += Number(m.importo||0);
    });
    return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]));
  },[mov]);
  const maxMese = Math.max(1, ...perMese.flatMap(([,v])=>[v.e,v.u]));

  const perCategoria = useMemo(()=>{
    const map = {};
    mov.filter(m=>m.verso==="Uscita").forEach(m=>{ map[m.categoria] = (map[m.categoria]||0) + Number(m.importo||0); });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[mov]);

  const set = (k,v)=>setModale(m=>({...m,[k]:v}));
  const conferma = async () => {
    const d = {...modale};
    if(!d.descrizione.trim()) return toast("Serve una descrizione");
    if(!(Number(d.importo)>0)) return toast("L'importo deve essere maggiore di zero");
    d.importo = Number(d.importo);
    const {id,...dati} = d;
    await salva(COL.movimenti,id,dati);
    setModale(null); toast("Movimento registrato");
  };
  const rimuovi = async m => { if(confirm(`Elimini "${m.descrizione}"?`)){ await elimina(COL.movimenti,m.id); toast("Movimento eliminato"); } };

  const esporta = () => scaricaCSV([
    ["Data","Verso","Categoria","Descrizione","Importo","Metodo","Persona","Incassato"],
    ...mov.map(m=>[dataIT(m.data),m.verso,m.categoria,m.descrizione,String(m.importo).replace(".",","),m.metodo,
      (membri.find(x=>x.id===m.membroId)||{}).cognome||"",m.incassato?"Sì":"No"])
  ], `movimenti_${anno}.csv`);

  const cat = modale?.verso==="Entrata" ? CAT_ENTRATA : CAT_USCITA;

  return (
    <div className="section">
      <div className="grid g4" style={{marginBottom:14}}>
        <Stat k="Entrate" v={eur(entrate)} s={anno} tono="mint" />
        <Stat k="Uscite" v={eur(uscite)} s={anno} tono="coral" />
        <Stat k="Saldo" v={eur(saldo)} s={saldo>=0?"in attivo":"in passivo"} tono={saldo>=0?"mint":"coral"} />
        <Stat k="Da incassare" v={eur(daIncassare)} s="quote e crediti aperti" tono={daIncassare?"amber":null} />
      </div>

      <div className="grid" style={{gridTemplateColumns:"1.6fr 1fr", marginBottom:14}}>
        <div className="card">
          <div className="card-h"><h3>Andamento mensile</h3></div>
          <div className="card-b">
            {perMese.length===0
              ? <Vuoto titolo="Nessun movimento" testo={`Non c'è ancora nulla registrato nel ${anno}.`} />
              : <div style={{display:"flex",gap:10,alignItems:"flex-end",height:170,overflowX:"auto",paddingBottom:4}}>
                  {perMese.map(([k,v])=>(
                    <div key={k} style={{minWidth:44,textAlign:"center",flex:1}}>
                      <div style={{display:"flex",gap:3,alignItems:"flex-end",height:130,justifyContent:"center"}}>
                        <div title={"Entrate "+eur(v.e)} style={{width:"42%",height:Math.max(2,v.e/maxMese*130)+"px",background:"var(--mint)",borderRadius:"3px 3px 0 0"}}></div>
                        <div title={"Uscite "+eur(v.u)} style={{width:"42%",height:Math.max(2,v.u/maxMese*130)+"px",background:"var(--coral)",borderRadius:"3px 3px 0 0"}}></div>
                      </div>
                      <div style={{fontSize:10,color:"var(--muted)",marginTop:6,textTransform:"uppercase",letterSpacing:".04em"}}>{nomeMese(k)}</div>
                    </div>
                  ))}
                </div>}
            <div style={{display:"flex",gap:16,marginTop:12,fontSize:11,color:"var(--muted)"}}>
              <span><i style={{display:"inline-block",width:9,height:9,background:"var(--mint)",borderRadius:2,marginRight:5}}></i>Entrate</span>
              <span><i style={{display:"inline-block",width:9,height:9,background:"var(--coral)",borderRadius:2,marginRight:5}}></i>Uscite</span>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-h"><h3>Uscite per categoria</h3></div>
          <div className="card-b">
            {perCategoria.length===0
              ? <Vuoto titolo="Nessuna uscita" testo="" />
              : perCategoria.map(([c,v])=>(
                  <div key={c} style={{marginBottom:11}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                      <span>{c}</span><span className="mono" style={{fontWeight:600}}>{eur(v)}</span>
                    </div>
                    <div className="bar"><i style={{width:(v/uscite*100)+"%",background:"var(--coral)"}}></i></div>
                  </div>
                ))}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <h3>Movimenti — {mov.length}</h3>
          <div style={{display:"flex",gap:8}}>
            <select style={{width:110}} value={anno} onChange={e=>setAnno(e.target.value)}>{anni.map(a=><option key={a}>{a}</option>)}</select>
            <button className="btn ghost sm" onClick={esporta}>CSV</button>
            <button className="btn sm" onClick={()=>setModale({...MOV_VUOTO})}>+ Registra</button>
          </div>
        </div>
        {mov.length===0
          ? <Vuoto titolo="Registro vuoto" testo="Registra quote, sponsor, affitto palestra e trasferte." />
          : <div className="tw"><table>
              <thead><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th>Persona</th><th>Metodo</th><th className="num">Importo</th><th></th></tr></thead>
              <tbody>{mov.map(m=>{
                const e = m.verso==="Entrata";
                const p = membri.find(x=>x.id===m.membroId);
                return (
                  <tr key={m.id}>
                    <td className="mono" style={{whiteSpace:"nowrap"}}>{dataIT(m.data)}</td>
                    <td>
                      <strong>{m.descrizione}</strong>
                      {e && !m.incassato && <span className="pill p-warn" style={{marginLeft:6}}>da incassare</span>}
                      {m.origine==="multa" && <span className="pill p-neutral" style={{marginLeft:6}}>da Multe</span>}
                    </td>
                    <td style={{fontSize:12,color:"var(--muted)"}}>{m.categoria}</td>
                    <td style={{fontSize:12}}>{p ? `${p.cognome} ${p.nome}` : "—"}</td>
                    <td style={{fontSize:12,color:"var(--muted)"}}>{m.metodo}</td>
                    <td className="num" style={{color: e?"var(--mint)":"var(--coral)", fontWeight:700, whiteSpace:"nowrap"}}>
                      {e?"+":"−"} {eur(m.importo).replace("€","").trim()}
                    </td>
                    <td style={{whiteSpace:"nowrap"}}>
                      <button className="btn ghost sm" onClick={()=>setModale({...MOV_VUOTO,...m})}>Modifica</button>{" "}
                      <button className="btn danger sm" onClick={()=>rimuovi(m)}>×</button>
                    </td>
                  </tr>
                );
              })}</tbody>
            </table></div>}
      </div>

      {modale && (
        <Modale titolo={modale.id?"Modifica movimento":"Registra movimento"} onChiudi={()=>setModale(null)} onSalva={conferma}>
          <div className="row g3">
            <Campo label="Verso">
              <select value={modale.verso} onChange={e=>{
                const v = e.target.value;
                setModale(m=>({...m, verso:v, categoria: v==="Entrata" ? CAT_ENTRATA[0] : CAT_USCITA[0]}));
              }}>
                <option>Uscita</option><option>Entrata</option>
              </select>
            </Campo>
            <Campo label="Data"><input type="date" value={modale.data} onChange={e=>set("data",e.target.value)} /></Campo>
            <Campo label="Importo €"><input type="number" step="0.01" min="0" value={modale.importo} onChange={e=>set("importo",e.target.value)} /></Campo>
          </div>
          <Campo label="Descrizione"><input value={modale.descrizione} onChange={e=>set("descrizione",e.target.value)} placeholder={modale.verso==="Entrata"?"Quota associativa 2026/27":"Affitto palestra — settembre"} /></Campo>
          <div className="row g2">
            <Campo label="Categoria"><select value={modale.categoria} onChange={e=>set("categoria",e.target.value)}>{cat.map(c=><option key={c}>{c}</option>)}</select></Campo>
            <Campo label="Metodo">
              <select value={modale.metodo} onChange={e=>set("metodo",e.target.value)}>
                <option>Contanti</option><option>Bonifico</option><option>Carta</option><option>Satispay</option><option>Altro</option>
              </select>
            </Campo>
          </div>
          <div className="row g2">
            <Campo label="Persona collegata (opzionale)">
              <select value={modale.membroId} onChange={e=>set("membroId",e.target.value)}>
                <option value="">Nessuna</option>
                {membri.map(m=><option key={m.id} value={m.id}>{m.cognome} {m.nome}</option>)}
              </select>
            </Campo>
            {modale.verso==="Entrata" && (
              <Campo label="Stato">
                <select value={modale.incassato?"si":"no"} onChange={e=>set("incassato",e.target.value==="si")}>
                  <option value="si">Incassato</option><option value="no">Da incassare</option>

              </Campo>
            )}

        </Modale>
      )}
    </div>
  );
}

const METODI_PAGAMENTO = ["Contanti","Bonifico","PayPal","Satispay","Carta","Altro"];
const TIPI_MULTA_PREDEFINITI = [
  {nome:"Ritardo all'allenamento", importo:2, note:""},
  {nome:"Assenza ingiustificata all'allenamento", importo:5, note:""},
  {nome:"Ritardo alla partita", importo:5, note:""},
  {nome:"Ammonizione per proteste", importo:5, note:""},
  {nome:"Espulsione", importo:10, note:""},
  {nome:"Materiale dimenticato", importo:2, note:""}
];

/* Messaggio leggibile per gli errori di salvataggio */
const msgErrore = e => (e && e.code==="permission-denied")
  ? "Permesso negato da Firebase: aggiungi fg_multe e fg_tipi_multa alle regole di Firestore"
  : "Errore nel salvataggio: " + ((e && e.message) || e);

/* Stagione sportiva: da luglio a giugno (es. 2026/27) */
const stagioneDi = d => {
  if(!d) return "";
  const y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
  const a = m >= 7 ? y : y-1;
  return `${a}/${String((a+1)%100).padStart(2,"0")}`;
};
const qtaVoce = v => Math.max(1, parseInt(v.qta) || 1);
const totaleVoci = voci => (voci||[]).reduce((s,v)=>s + (Number(v.importo)||0) * qtaVoce(v), 0);
const importoMulta = m => (m.voci && m.voci.length) ? totaleVoci(m.voci) : Number(m.importo||0);
const causaleMulta = m => (m.voci||[]).map(v=>`${v.nome||"—"}${qtaVoce(v)>1?` ×${qtaVoce(v)}`:""}`).join(" + ") || (m.descrizione||"—");

/* Opzioni della rosa raggruppate per giocatori e dirigenti */
function OpzioniPersone({membri, corrente, tutti}){
  const vis = membri.filter(m => tutti || m.attivo !== false || m.id === corrente);
  const ord = arr => [...arr].sort((a,b)=>(a.cognome||"").localeCompare(b.cognome||""));
  const g = ord(vis.filter(m=>m.tipo==="Giocatore"));
  const d = ord(vis.filter(m=>m.tipo!=="Giocatore"));
  return (
    <>
      {g.length>0 && <optgroup label="Giocatori">
        {g.map(m=><option key={m.id} value={m.id}>{m.cognome} {m.nome}{m.numero!==""&&m.numero!=null?` (#${m.numero})`:""}</option>)}
      </optgroup>}
      {d.length>0 && <optgroup label="Dirigenti e staff">
        {d.map(m=><option key={m.id} value={m.id}>{m.cognome} {m.nome}{m.ruolo?` — ${m.ruolo}`:""}</option>)}
      </optgroup>}
    </>
  );
}

function TipiMultaManager({tipiMulta, toast, onChiudi}){
  const vuoto = {nome:"", importo:"", note:""};
  const [f,setF] = useState(vuoto);
  const set = (k,v)=>setF(x=>({...x,[k]:v}));
  const lista = [...tipiMulta].sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));

  const salvaTipo = async () => {
    if(!f.nome.trim()) return toast("Serve il nome della multa");
    if(f.importo==="" || !(Number(f.importo)>=0)) return toast("Indica l'importo");
    const {id, ...dati} = f;
    dati.nome = dati.nome.trim();
    dati.importo = Math.round(Number(dati.importo)*100)/100;
    dati.note = (dati.note||"").trim();
    try{
      await salva(COL.tipiMulta, id, dati);
      setF(vuoto); toast(id ? "Tipo di multa aggiornato" : "Tipo di multa creato");
    }catch(e){ console.error(e); toast(msgErrore(e)); }
  };
  const modifica = t => setF({...vuoto, ...t});
  const rimuovi = async t => {
    if(confirm(`Elimini "${t.nome}"? Le multe già registrate non cambiano.`)){
      try{ await elimina(COL.tipiMulta, t.id); if(f.id===t.id) setF(vuoto); toast("Tipo di multa eliminato"); }
      catch(e){ console.error(e); toast(msgErrore(e)); }
    }
  };
  const caricaPredefiniti = async () => {
    try{
      for(const t of TIPI_MULTA_PREDEFINITI){
        if(!tipiMulta.some(x=>x.nome===t.nome)) await salva(COL.tipiMulta, null, t);
      }
      toast("Esempi aggiunti: modifica gli importi come preferisci");
    }catch(e){ console.error(e); toast(msgErrore(e)); }
  };

  return (
    <Modale titolo="Anagrafica tipi di multa" onChiudi={onChiudi} larghezza={680}>
      <div className="row g3">
        <Campo label="Nome" span={2}><input value={f.nome} onChange={e=>set("nome",e.target.value)} placeholder="es. Ritardo all'allenamento" /></Campo>
        <Campo label="Importo €"><input type="number" step="0.5" min="0" value={f.importo} onChange={e=>set("importo",e.target.value)} /></Campo>
      </div>
      <Campo label="Note (opzionale)"><input value={f.note} onChange={e=>set("note",e.target.value)} placeholder="es. oltre 10 minuti di ritardo" /></Campo>
      <div style={{display:"flex",gap:8,marginBottom:4}}>
        <button className="btn sm" onClick={salvaTipo}>{f.id?"Salva modifica":"+ Aggiungi tipo"}</button>
        {f.id && <button className="btn ghost sm" onClick={()=>setF(vuoto)}>Annulla</button>}
      </div>
      <div className="divider"></div>
      {lista.length===0
        ? <div>
            <div className="hint" style={{marginBottom:10}}>Non hai ancora tipi di multa. Creali qui sopra oppure parti da qualche esempio già pronto e modifica gli importi.</div>
            <button className="btn ghost sm" onClick={caricaPredefiniti}>Aggiungi esempi</button>
          </div>
        : <div className="tw"><table>
            <thead><tr><th>Tipo</th><th className="num">Importo</th><th></th></tr></thead>
            <tbody>{lista.map(t=>(
              <tr key={t.id}>
                <td><strong>{t.nome}</strong>{t.note && <div style={{fontSize:11,color:"var(--muted)"}}>{t.note}</div>}</td>
                <td className="num" style={{fontWeight:700}}>{eur(t.importo)}</td>
                <td style={{whiteSpace:"nowrap",textAlign:"right"}}>
                  <button className="btn ghost sm" onClick={()=>modifica(t)}>Modifica</button>{" "}
                  <button className="btn danger sm" onClick={()=>rimuovi(t)}>×</button>
                </td>
              </tr>
            ))}</tbody>
          </table></div>}
    </Modale>
  );
}

function Multe({multe, tipiMulta, membri, toast}){
  const [modale,setModale] = useState(null);
  const [incasso,setIncasso] = useState(null);
  const [gestioneTipi,setGestioneTipi] = useState(false);
  const [stagione,setStagione] = useState(stagioneDi(oggi()));
  const [stato,setStato] = useState("Tutte");
  const [persona,setPersona] = useState("");
  const [q,setQ] = useState("");

  const nomeP = useCallback(id => {
    const m = membri.find(x=>x.id===id);
    return m ? `${m.cognome} ${m.nome}` : "— (non più in rosa)";
  },[membri]);

  const tipiOrd = useMemo(()=>[...tipiMulta].sort((a,b)=>(a.nome||"").localeCompare(b.nome||"")),[tipiMulta]);

  const stagioni = useMemo(()=>{
    const s = new Set(multe.map(m=>stagioneDi(m.data)).filter(Boolean));
    s.add(stagioneDi(oggi()));
    return [...s].sort().reverse();
  },[multe]);

  const diStagione = useMemo(()=>multe.filter(m=>stagione==="Tutte" || stagioneDi(m.data)===stagione),[multe,stagione]);

  const lista = useMemo(()=>{
    const t = q.trim().toLowerCase();
    return diStagione
      .filter(m => stato==="Tutte" || (stato==="Da pagare" ? !m.pagata : m.pagata))
      .filter(m => !persona || m.membroId===persona)
      .filter(m => !t || `${nomeP(m.membroId)} ${causaleMulta(m)} ${m.note||""}`.toLowerCase().includes(t))
      .sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  },[diStagione,stato,persona,q,nomeP]);

  const totale      = diStagione.reduce((s,m)=>s+importoMulta(m),0);
  const incassato   = diStagione.filter(m=>m.pagata).reduce((s,m)=>s+importoMulta(m),0);
  const daIncassare = totale - incassato;
  const aperte      = diStagione.filter(m=>!m.pagata).length;

  const perPersona = useMemo(()=>{
    const map = {};
    diStagione.forEach(m=>{
      const k = m.membroId||"";
      if(!map[k]) map[k] = {id:k, n:0, tot:0, pagato:0};
      const imp = importoMulta(m);
      map[k].n++; map[k].tot += imp; if(m.pagata) map[k].pagato += imp;
    });
    return Object.values(map).sort((a,b)=>((b.tot-b.pagato)-(a.tot-a.pagato)) || (b.tot-a.tot));
  },[diStagione]);

  const perTipo = useMemo(()=>{
    const map = {};
    diStagione.forEach(m=>(m.voci||[]).forEach(v=>{
      const k = v.nome || "Altro";
      if(!map[k]) map[k] = {n:0, tot:0};
      map[k].n += qtaVoce(v); map[k].tot += (Number(v.importo)||0)*qtaVoce(v);
    }));
    return Object.entries(map).sort((a,b)=>b[1].tot-a[1].tot);
  },[diStagione]);
  const maxTipo = Math.max(1, ...perTipo.map(([,v])=>v.tot));

  /* --- voci --- */
  const nuovaVoce = () => {
    const t = tipiOrd[0];
    return t ? {id:uid(), tipoId:t.id, nome:t.nome, importo:t.importo, qta:1}
             : {id:uid(), tipoId:"custom", nome:"", importo:"", qta:1};
  };
  const nuova = () => setModale({
    data:oggi(), membroId:persona||"", voci:[nuovaVoce()],
    pagata:false, dataPagamento:"", metodo:"Contanti", registraInCassa:true, movimentoId:"", note:""
  });
  const apri = m => setModale({
    pagata:false, dataPagamento:"", metodo:"Contanti", note:"", movimentoId:"",
    registraInCassa: m.movimentoId ? true : (m.registraInCassa ?? true),
    ...m,
    voci: (m.voci && m.voci.length) ? m.voci.map(v=>({...v}))
         : [{id:uid(), tipoId:"custom", nome:m.descrizione||"Multa", importo:m.importo||"", qta:1}]
  });
  const set = (k,v)=>setModale(m=>({...m,[k]:v}));
  const setVoce = (id,k,v)=>setModale(m=>({...m, voci:m.voci.map(x=>x.id===id?{...x,[k]:v}:x)}));
  const addVoce = ()=>setModale(m=>({...m, voci:[...m.voci, nuovaVoce()]}));
  const delVoce = id=>setModale(m=>({...m, voci:m.voci.filter(x=>x.id!==id)}));
  const scegliTipo = (id, tipoId) => {
    if(tipoId==="custom") return setVoce(id,"tipoId","custom");
    const t = tipiMulta.find(x=>x.id===tipoId);
    if(!t) return;
    setModale(m=>({...m, voci:m.voci.map(x=>x.id===id?{...x, tipoId:t.id, nome:t.nome, importo:t.importo}:x)}));
  };

  /* --- salvataggio: la multa e, se pagata, il movimento in Costi e ricavi --- */
  const registra = async d => {
    const {id, ...dati} = d;
    let movId = dati.movimentoId || "";
    if(dati.pagata && dati.registraInCassa){
      const mov = {
        data: dati.dataPagamento || oggi(), verso:"Entrata", categoria:"Multe",
        descrizione: `Multa ${nomeP(dati.membroId)} — ${causaleMulta(dati)}`,
        importo: dati.importo, metodo: dati.metodo, membroId: dati.membroId,
        incassato:true, origine:"multa"
      };
      if(movId) await db.collection(COL.movimenti).doc(movId).set(mov, {merge:true});
      else { const ref = await salva(COL.movimenti, null, mov); movId = ref.id; }
    } else if(movId){
      try{ await elimina(COL.movimenti, movId); }catch(e){ console.error(e); }
      movId = "";
    }
    dati.movimentoId = movId;
    await salva(COL.multe, id, dati);
  };

  const conferma = async () => {
    const d = {...modale};
    if(!d.membroId) return toast("Scegli chi deve pagare la multa");
    const voci = d.voci
      .map(v=>({id:v.id||uid(), tipoId:v.tipoId||"custom", nome:(v.nome||"").trim(), importo:Math.round((Number(v.importo)||0)*100)/100, qta:qtaVoce(v)}))
      .filter(v=>v.nome || v.importo);
    if(!voci.length) return toast("Aggiungi almeno una voce");
    if(voci.some(v=>!v.nome)) return toast("Ogni voce ha bisogno di una descrizione");
    const tot = Math.round(totaleVoci(voci)*100)/100;
    if(!(tot>0)) return toast("Il totale deve essere maggiore di zero");
    d.voci = voci; d.importo = tot; d.note = (d.note||"").trim();
    if(d.pagata){ if(!d.dataPagamento) d.dataPagamento = oggi(); }
    else d.dataPagamento = "";
    try{
      await registra(d);
      setModale(null); toast(d.id ? "Multa aggiornata" : "Multa registrata");
    }catch(e){ console.error(e); toast(msgErrore(e)); }
  };

  const apriIncasso = m => setIncasso({multa:m, data:oggi(), metodo:m.metodo||"Contanti", registraInCassa:true});
  const confermaIncasso = async () => {
    const {multa, data, metodo, registraInCassa} = incasso;
    try{
      await registra({...multa, importo:importoMulta(multa), pagata:true, dataPagamento:data||oggi(), metodo, registraInCassa});
      setIncasso(null); toast("Multa segnata come pagata");
    }catch(e){ console.error(e); toast(msgErrore(e)); }
  };

  const rimuovi = async m => {
    const extra = m.movimentoId ? " Verrà tolto anche l'incasso registrato in Costi e ricavi." : "";
    if(!confirm(`Elimini la multa di ${nomeP(m.membroId)} (${eur(importoMulta(m))})?${extra}`)) return;
    try{
      await elimina(COL.multe, m.id);
      if(m.movimentoId){ try{ await elimina(COL.movimenti, m.movimentoId); }catch(e){ console.error(e); } }
      toast("Multa eliminata");
    }catch(e){ console.error(e); toast(msgErrore(e)); }
  };

  /* --- export --- */
  const etichettaFiltro = [stagione==="Tutte"?"Tutte le stagioni":`Stagione ${stagione}`, stato!=="Tutte"?stato.toLowerCase():"", persona?nomeP(persona):""].filter(Boolean).join(" · ");
  const esportaCSV = () => {
    if(!lista.length) return toast("Nessuna multa da esportare");
    scaricaCSV([
      ["Data","Persona","Causale","Importo","Stato","Data pagamento","Metodo","Note"],
      ...lista.map(m=>[dataIT(m.data), nomeP(m.membroId), causaleMulta(m), String(importoMulta(m).toFixed(2)).replace(".",","),
        m.pagata?"Pagata":"Da pagare", m.pagata?dataIT(m.dataPagamento):"", m.pagata?m.metodo:"", m.note||""])
    ], `multe_${(stagione==="Tutte"?"tutte":stagione.replace("/","-"))}.csv`);
  };
  const esportaPDF = () => {
    if(!lista.length) return toast("Nessuna multa da esportare");
    const tot = lista.reduce((s,m)=>s+importoMulta(m),0);
    const aperto = lista.filter(m=>!m.pagata).reduce((s,m)=>s+importoMulta(m),0);
    salvaPDF({
      nomeFile:`multe_${(stagione==="Tutte"?"tutte":stagione.replace("/","-"))}.pdf`, titolo:"Multe", orientamento:"landscape",
      sottotitolo:`${etichettaFiltro} · totale ${eur(tot)} · da incassare ${eur(aperto)} · ${dataIT(oggi())}`,
      sezioni:[{
        head:["Data","Persona","Causale","Importo","Stato","Pagamento"],
        body:lista.map(m=>[dataIT(m.data), nomeP(m.membroId), causaleMulta(m), eur(importoMulta(m)),
          m.pagata?"Pagata":"Da pagare", m.pagata?`${m.metodo||""} ${dataIT(m.dataPagamento)}`:""])
      }]
    });
  };

  const totModale = modale ? totaleVoci(modale.voci) : 0;

  return (
    <div className="section">
      <div className="grid g4" style={{marginBottom:14}}>
        <Stat k="Multe" v={diStagione.length} s={stagione==="Tutte"?"tutte le stagioni":`stagione ${stagione}`} />
        <Stat k="Totale" v={eur(totale)} s="importo complessivo" />
        <Stat k="Incassato" v={eur(incassato)} s="multe pagate" tono="mint" />
        <Stat k="Da incassare" v={eur(daIncassare)} s={`${aperte} ${aperte===1?"multa aperta":"multe aperte"}`} tono={daIncassare>0?"amber":"mint"} />
      </div>

      {tipiOrd.length===0 && (
        <div className="card" style={{marginBottom:14}}><div className="card-b" style={{display:"flex",gap:12,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
          <div style={{fontSize:13}}><strong>Crea prima l'anagrafica delle multe</strong> <span style={{color:"var(--muted)"}}>— così scegliendo il tipo l'importo si compila da solo.</span></div>
          <button className="btn sm" onClick={()=>setGestioneTipi(true)}>Tipi di multa</button>
        </div></div>
      )}

      <div className="grid g2" style={{marginBottom:14}}>
        <div className="card">
          <div className="card-h"><h3>Situazione per persona</h3></div>
          {perPersona.length===0
            ? <Vuoto titolo="Nessuna multa" testo="Qui vedrai chi ha multe e quanto deve ancora." />
            : <div className="tw"><table>
                <thead><tr><th>Persona</th><th className="num">N.</th><th className="num">Totale</th><th className="num">Deve</th></tr></thead>
                <tbody>{perPersona.map(p=>{
                  const resto = p.tot - p.pagato;
                  return (
                    <tr key={p.id} style={{cursor:"pointer"}} title="Mostra solo le sue multe" onClick={()=>setPersona(persona===p.id?"":p.id)}>
                      <td><strong>{nomeP(p.id)}</strong>{persona===p.id && <span className="pill p-neutral" style={{marginLeft:6}}>filtro</span>}</td>
                      <td className="num">{p.n}</td>
                      <td className="num">{eur(p.tot)}</td>
                      <td className="num" style={{fontWeight:700,color:resto>0?"var(--coral)":"var(--mint)"}}>{resto>0?eur(resto):"in regola"}</td>
                    </tr>
                  );
                })}</tbody>
              </table></div>}
        </div>

        <div className="card">
          <div className="card-h"><h3>Per tipologia</h3></div>
          <div className="card-b">
            {perTipo.length===0
              ? <Vuoto titolo="Nessun dato" testo="" />
              : perTipo.map(([nome,v])=>(
                  <div key={nome} style={{marginBottom:11}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4,gap:8}}>
                      <span>{nome} <span style={{color:"var(--muted)"}}>×{v.n}</span></span>
                      <span className="mono" style={{fontWeight:600}}>{eur(v.tot)}</span>
                    </div>
                    <div className="bar"><i style={{width:(v.tot/maxTipo*100)+"%",background:"var(--amber)"}}></i></div>
                  </div>
                ))}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <h3>Registro multe — {lista.length}</h3>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn ghost sm" onClick={()=>setGestioneTipi(true)}>Tipi di multa</button>
            <button className="btn ghost sm" onClick={esportaCSV}>CSV</button>
            <button className="btn ghost sm" onClick={esportaPDF}>PDF</button>
            <button className="btn sm" onClick={nuova}>+ Nuova multa</button>
          </div>
        </div>
        <div className="card-b" style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",paddingBottom:4}}>
          <input style={{width:180}} placeholder="Cerca…" value={q} onChange={e=>setQ(e.target.value)} />
          <select style={{width:140}} value={stagione} onChange={e=>setStagione(e.target.value)}>
            <option value="Tutte">Tutte le stagioni</option>
            {stagioni.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <select style={{width:130}} value={stato} onChange={e=>setStato(e.target.value)}>
            <option>Tutte</option><option>Da pagare</option><option>Pagate</option>
          </select>
          <select style={{width:210}} value={persona} onChange={e=>setPersona(e.target.value)}>
            <option value="">Tutte le persone</option>
            <OpzioniPersone membri={membri} tutti />
          </select>
        </div>
        {lista.length===0
          ? <Vuoto titolo={multe.length?"Nessuna multa con questi filtri":"Registro vuoto"} testo={multe.length?"Prova a cambiare stagione, stato o persona.":"Registra la prima multa con “+ Nuova multa”."} />
          : <div className="tw"><table>
              <thead><tr><th>Data</th><th>Persona</th><th>Causale</th><th className="num">Importo</th><th>Stato</th><th></th></tr></thead>
              <tbody>{lista.map(m=>{
                const g = giorniA(m.data);
                return (
                  <tr key={m.id}>
                    <td className="mono" style={{whiteSpace:"nowrap"}}>{dataIT(m.data)}</td>
                    <td><strong>{nomeP(m.membroId)}</strong></td>
                    <td style={{fontSize:12}}>
                      {causaleMulta(m)}
                      {m.note && <div style={{fontSize:11,color:"var(--muted)"}}>{m.note}</div>}
                    </td>
                    <td className="num" style={{fontWeight:700,whiteSpace:"nowrap"}}>{eur(importoMulta(m))}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      {m.pagata
                        ? <><span className="pill p-ok">Pagata</span><div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>{m.metodo} · {dataIT(m.dataPagamento)}</div></>
                        : <><span className="pill p-warn">Da pagare</span>{g<0 && <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>da {-g} gg</div>}</>}
                    </td>
                    <td style={{whiteSpace:"nowrap",textAlign:"right"}}>
                      {!m.pagata && <><button className="btn sm" onClick={()=>apriIncasso(m)}>Incassa</button>{" "}</>}
                      <button className="btn ghost sm" onClick={()=>apri(m)}>Modifica</button>{" "}
                      <button className="btn danger sm" onClick={()=>rimuovi(m)}>×</button>
                    </td>
                  </tr>
                );
              })}</tbody>
            </table></div>}
      </div>

      {modale && (
        <Modale titolo={modale.id?"Modifica multa":"Nuova multa"} onChiudi={()=>setModale(null)} onSalva={conferma} larghezza={740}>
          <div className="row g2">
            <Campo label="Chi deve pagare">
              <select value={modale.membroId} onChange={e=>set("membroId",e.target.value)}>
                <option value="">— Scegli dalla rosa —</option>
                <OpzioniPersone membri={membri} corrente={modale.membroId} />
              </select>
            </Campo>
            <Campo label="Data della multa"><input type="date" value={modale.data} onChange={e=>set("data",e.target.value)} /></Campo>
          </div>

          <label>Voci della multa</label>
          {tipiOrd.length===0 && <div className="hint" style={{marginTop:0,marginBottom:8}}>Nessun tipo in anagrafica: puoi comunque inserire voci personalizzate, oppure crea i tipi con il pulsante “Tipi di multa”.</div>}
          <div className="mv-row mv-head"><span>Tipo</span><span>Descrizione</span><span>Importo €</span><span>Q.tà</span><span></span></div>
          {modale.voci.map(v=>(
            <div key={v.id} className="mv-row">
              <select value={v.tipoId} onChange={e=>scegliTipo(v.id,e.target.value)}>
                {tipiOrd.map(t=><option key={t.id} value={t.id}>{t.nome} — {eur(t.importo)}</option>)}
                {v.tipoId!=="custom" && !tipiOrd.some(t=>t.id===v.tipoId) && <option value={v.tipoId}>{v.nome} (tipo eliminato)</option>}
                <option value="custom">✎ Personalizzata…</option>
              </select>
              <input className="mv-full" value={v.nome} onChange={e=>setVoce(v.id,"nome",e.target.value)} placeholder={v.tipoId==="custom"?"es. Ritardo + cellulare in spogliatoio":"Descrizione"} />
              <input type="number" step="0.5" min="0" value={v.importo} onChange={e=>setVoce(v.id,"importo",e.target.value)} />
              <input type="number" step="1" min="1" value={v.qta} onChange={e=>setVoce(v.id,"qta",e.target.value)} />
              <button className="btn danger sm" onClick={()=>delVoce(v.id)} disabled={modale.voci.length===1} title="Togli voce">×</button>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginTop:4,flexWrap:"wrap"}}>
            <button className="btn ghost sm" onClick={addVoce}>+ Aggiungi voce</button>
            <div style={{fontSize:13,color:"var(--muted)"}}>Totale <span style={{fontFamily:"Archivo",fontWeight:800,fontSize:22,color:"var(--ink)",marginLeft:6}}>{eur(totModale)}</span></div>
          </div>

          <div className="divider"></div>

          <label className={"chk "+(modale.pagata?"on":"")} style={{marginBottom:10}}>
            <input type="checkbox" checked={!!modale.pagata} onChange={e=>{
              const on = e.target.checked;
              setModale(m=>({...m, pagata:on, dataPagamento: on ? (m.dataPagamento||oggi()) : m.dataPagamento}));
            }} />
            Già pagata
          </label>
          {modale.pagata && (
            <>
              <div className="row g2">
                <Campo label="Data pagamento"><input type="date" value={modale.dataPagamento} onChange={e=>set("dataPagamento",e.target.value)} /></Campo>
                <Campo label="Metodo">
                  <select value={modale.metodo} onChange={e=>set("metodo",e.target.value)}>
                    {METODI_PAGAMENTO.map(x=><option key={x}>{x}</option>)}
                    {modale.metodo && !METODI_PAGAMENTO.includes(modale.metodo) && <option>{modale.metodo}</option>}
                  </select>
                </Campo>
              </div>
              <label className={"chk "+(modale.registraInCassa?"on":"")} style={{marginBottom:12}}>
                <input type="checkbox" checked={!!modale.registraInCassa} onChange={e=>set("registraInCassa",e.target.checked)} />
                Registra l'incasso in Costi e ricavi
              </label>
            </>
          )}
          <Campo label="Note"><textarea rows="2" value={modale.note} onChange={e=>set("note",e.target.value)} /></Campo>
        </Modale>
      )}

      {incasso && (
        <Modale titolo="Incassa multa" onChiudi={()=>setIncasso(null)} onSalva={confermaIncasso} salvaLabel="Segna come pagata" larghezza={460}>
          <div style={{marginBottom:14}}>
            <div style={{fontWeight:700}}>{nomeP(incasso.multa.membroId)}</div>
            <div style={{fontSize:12,color:"var(--muted)"}}>{causaleMulta(incasso.multa)}</div>
            <div style={{fontFamily:"Archivo",fontWeight:800,fontSize:24,marginTop:6}}>{eur(importoMulta(incasso.multa))}</div>
          </div>
          <div className="row g2">
            <Campo label="Data pagamento"><input type="date" value={incasso.data} onChange={e=>setIncasso(x=>({...x,data:e.target.value}))} /></Campo>
            <Campo label="Metodo">
              <select value={incasso.metodo} onChange={e=>setIncasso(x=>({...x,metodo:e.target.value}))}>
                {METODI_PAGAMENTO.map(x=><option key={x}>{x}</option>)}
              </select>
            </Campo>
          </div>
          <label className={"chk "+(incasso.registraInCassa?"on":"")}>
            <input type="checkbox" checked={incasso.registraInCassa} onChange={e=>setIncasso(x=>({...x,registraInCassa:e.target.checked}))} />
            Registra l'incasso in Costi e ricavi
          </label>
        </Modale>
      )}

      {gestioneTipi && <TipiMultaManager tipiMulta={tipiMulta} toast={toast} onChiudi={()=>setGestioneTipi(false)} />}
    </div>
  );
}

  verde:   {nome:"Verde",   fondo:"#22604A", campo:"#2E7D5B", striscia:"#328661", linee:"rgba(255,255,255,.92)", freccia:"#FFFFFF", tiro:"#FFD23F", testo:"#FFFFFF", ombra:"rgba(0,0,0,.5)",  bordo:"#FFFFFF", rete:"rgba(255,255,255,.22)"},
  blu:     {nome:"Blu",     fondo:"#1D467F", campo:"#2A5DA8", striscia:"#2E64B2", linee:"rgba(255,255,255,.92)", freccia:"#FFFFFF", tiro:"#FFD23F", testo:"#FFFFFF", ombra:"rgba(0,0,0,.5)",  bordo:"#FFFFFF", rete:"rgba(255,255,255,.22)"},
  parquet: {nome:"Parquet", fondo:"#8E6135", campo:"#D8A96E", striscia:"#D1A065", linee:"rgba(255,255,255,.95)", freccia:"#1A1A1A", tiro:"#B42318", testo:"#1A1A1A", ombra:"rgba(255,255,255,.65)", bordo:"#FFFFFF", rete:"rgba(255,255,255,.3)"},
  lavagna: {nome:"Bianco (stampa)", fondo:"#E9EEEC", campo:"#FFFFFF", striscia:"#FFFFFF", linee:"#2A433E", freccia:"#1B2B28", tiro:"#C2410C", testo:"#1B2B28", ombra:"rgba(255,255,255,.85)", bordo:"#1B2B28", rete:"rgba(0,0,0,.06)"}
};
const TIPI_FRECCIA = {
  corsa:      {nome:"Movimento",  corto:"Corsa", simbolo:"→"},
  passaggio:  {nome:"Passaggio",  corto:"Pass.", simbolo:"⇢"},
  conduzione: {nome:"Conduzione", corto:"Cond.", simbolo:"∿"},
  tiro:       {nome:"Tiro",       corto:"Tiro",  simbolo:"➔"}
};
const R_PEDINA = 0.62, R_PALLA = 0.32, R_CONO = 0.4, MARGINE = 1.6;

/* Modelli di partenza: [tipo, portiere, etichetta, x, y] */
const MODELLI_SCHEMA = {
  vuoto:      {nome:"Campo vuoto", categoria:"Altro", vista:"intero", pezzi:[["palla",0,"",20,10]]},
  angolo:     {nome:"Angolo", categoria:"Angolo", vista:"meta", pezzi:[
    ["palla",0,"",39.75,0.25],["casa",0,"7",40.7,-0.7],["casa",0,"10",33.5,4.5],["casa",0,"9",35.5,11],["casa",0,"8",30,9],["casa",1,"P",6,10],
    ["ospite",1,"",39.3,10],["ospite",0,"",37,4.8],["ospite",0,"",35.2,8.8],["ospite",0,"",36,13],["ospite",0,"",31.5,7]]},
  punizione:  {nome:"Punizione dal limite", categoria:"Punizione", vista:"meta", pezzi:[
    ["palla",0,"",30,11],["casa",0,"10",29.2,11.9],["casa",0,"7",29.4,9.9],["casa",0,"9",34.5,15.5],["casa",0,"8",26,6.5],["casa",1,"P",6,10],
